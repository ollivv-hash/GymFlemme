# Tests, lint and release APKs of both variants ("github", "play") on every pull request and push to main.
# Since V2.28 releases are published by publish.yml, on a tag v* (docs/publication.md), no longer on a merge.
#
# Release signing uses four repository secrets (Settings → Secrets and variables → Actions):
#   FORME_KEYSTORE_BASE64  the .jks file, base64-encoded
#   FORME_STORE_PASSWORD   keystore password
#   FORME_KEY_ALIAS        key alias (forme)
#   FORME_KEY_PASSWORD     key password
#   (secret names kept from the app's former name "Forme")
# Without them the APKs are built unsigned (not installable).
#
# Runner pinned to ubuntu-24.04 (ubuntu-latest moves to Ubuntu 26 from 2026-10-19) and actions on Node 24
# (Node 20 is deprecated on the runners): bump them on purpose, together, when needed.
name: Android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.name }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v5

      - name: Version
        id: version
        run: echo "name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.FORME_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FORME_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FORME_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FORME_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets: the release APK will be unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/forme-release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/forme-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Both variants compile and pass the tests; the "play" one also checks it holds no install permission.
      - name: Tests, lint, release builds
        run: |
          ./gradlew testGithubDebugUnitTest testPlayDebugUnitTest lintGithubDebug lintPlayDebug \
            assembleGithubRelease assemblePlayRelease --stacktrace

      - name: Remove signing key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/forme-release.jks"

      - name: Rename APK
        run: |
          suffix=$([ "${{ steps.signing.outputs.signed }}" = true ] && echo "" || echo "-unsigned")
          mkdir -p dist
          cp "$(ls app/build/outputs/apk/github/release/*.apk | head -1)" "dist/gymflemme-${{ steps.version.outputs.name }}$suffix.apk"
          cp "$(ls app/build/outputs/apk/play/release/*.apk | head -1)" "dist/gymflemme-play-${{ steps.version.outputs.name }}$suffix.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: gymflemme-${{ steps.version.outputs.name }}-apk
          path: dist/*.apk
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/smoke-screens/
          retention-days: 7
