# Publishes a version (V2.28): on every push to main (a merged PR), if the release v<versionName> does not exist yet
# in the releases repository, tests, builds and signs the "github" variant, creates the release there with three
# files (the APK, its SHA-256 and update.json, read by the app to update itself), then tags the published commit
# v<versionName> in this repository. A merge that does not change versionName publishes nothing.
# "Run workflow" (workflow_dispatch, on main only) runs the same thing again, e.g. after a failure. See
# docs/publication.md.
#
# Secrets (Settings → Secrets and variables → Actions of THIS repository):
#   FORME_KEYSTORE_BASE64, FORME_STORE_PASSWORD, FORME_KEY_ALIAS, FORME_KEY_PASSWORD   the signing key (as android.yml)
#   GYMFLEMME_RELEASES_TOKEN   fine-grained token, Contents: read and write on the releases repository only
# GitHub masks secret values in the logs; none is printed. The certificate fingerprint printed is public.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASES_REPOSITORY: ollivv-hash/gymflemme-releases

jobs:
  # Fast: reads the version and asks the releases repository whether it is already published.
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      publish: ${{ steps.released.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: app/build.gradle.kts
          sparse-checkout-cone-mode: false

      - name: Version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts)
          if [ -z "$name" ] || [ -z "$code" ]; then
            echo "::error::versionName / versionCode not found in app/build.gradle.kts."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Already published?
        id: released
        env:
          GH_TOKEN: ${{ secrets.GYMFLEMME_RELEASES_TOKEN }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Missing secret GYMFLEMME_RELEASES_TOKEN (docs/publication.md). Nothing published."
            exit 1
          fi
          if out=$(gh release view "v$VERSION" --repo "$RELEASES_REPOSITORY" --json tagName 2>&1); then
            echo "::notice::v$VERSION is already published in $RELEASES_REPOSITORY: nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$out" | grep -qi "not found"; then
            echo "v$VERSION is not published yet: publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "$out"
            echo "::error::Could not read the releases of $RELEASES_REPOSITORY (token expired or without access?)."
            exit 1
          fi

  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write   # to push the tag v<version> on the published commit
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Secrets present
        env:
          KEYSTORE_BASE64: ${{ secrets.FORME_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FORME_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FORME_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FORME_KEY_PASSWORD }}
        run: |
          missing=""
          for v in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing (docs/publication.md). Nothing published."
            exit 1
          fi

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FORME_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FORME_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FORME_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FORME_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Tests and signed build ("github" variant)
        run: ./gradlew testGithubDebugUnitTest assembleGithubRelease --stacktrace

      - name: Remove signing key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - name: APK, SHA-256, update.json
        env:
          VERSION: ${{ needs.check.outputs.name }}
          CODE: ${{ needs.check.outputs.code }}
        run: |
          mkdir -p dist
          apk="dist/gymflemme-$VERSION.apk"
          cp "$(ls app/build/outputs/apk/github/release/*.apk | head -1)" "$apk"
          # The signing certificate: must be the one of the installed app, or Android refuses the update.
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs "$apk" | grep -i "SHA-256 digest" | sed 's/^/Signing certificate /'
          (cd dist && sha256sum "gymflemme-$VERSION.apk" > "gymflemme-$VERSION.apk.sha256")
          sha=$(cut -d' ' -f1 "dist/gymflemme-$VERSION.apk.sha256")
          notes=$(python3 tools/release/notes.py --plain "$VERSION")
          python3 - "$VERSION" "$CODE" "$sha" "$notes" "$RELEASES_REPOSITORY" > dist/update.json <<'PY'
          import json, sys
          version, code, sha, notes, repo = sys.argv[1:6]
          print(json.dumps({
              "versionCode": int(code),
              "versionName": version,
              "apkUrl": f"https://github.com/{repo}/releases/download/v{version}/gymflemme-{version}.apk",
              "sha256": sha,
              "minSdk": 28,
              "notes": notes,
          }, ensure_ascii=False, indent=2))
          PY
          cat dist/update.json

      - name: Release in the releases repository
        env:
          GH_TOKEN: ${{ secrets.GYMFLEMME_RELEASES_TOKEN }}
          VERSION: ${{ needs.check.outputs.name }}
        run: |
          if gh release view "v$VERSION" --repo "$RELEASES_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists in $RELEASES_REPOSITORY: bump the version to publish again."
            exit 1
          fi
          GITHUB_REPOSITORY="$GITHUB_REPOSITORY" python3 tools/release/notes.py "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" dist/gymflemme-*.apk dist/gymflemme-*.apk.sha256 dist/update.json \
            --repo "$RELEASES_REPOSITORY" --title "GymFlemme $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Tag the published commit
        env:
          VERSION: ${{ needs.check.outputs.name }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::notice::Tag v$VERSION already exists in this repository: left as is."
          else
            git tag "v$VERSION" "$GITHUB_SHA"
            git push origin "v$VERSION"
          fi
